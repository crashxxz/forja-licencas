services:
  - type: web
    name: forja-licencas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python licenca_servidor.py serve --host 0.0.0.0
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DOCFLOW_LICENSE_PRIVATE_N
        sync: false
      - key: DOCFLOW_LICENSE_PRIVATE_D
        sync: false
